# LitematicaFolia configuration

paste:
  # Hard cap on blocks placed per chunk-task before yielding back to the
  # region scheduler. Prevents long ticks on huge schematics.
  maxBlocksPerChunkTask: 8192
  # Spawn entities (players excluded) found in the schematic file.
  allowEntities: true
  # Reload TileEntity NBT data (chests, signs, etc).
  allowTileEntities: true
  # Re-schedule PendingBlockTicks / PendingFluidTicks from the schematic.
  # Differentiator vs WorldEdit, which discards them.
  allowPendingTicks: true
  # If true, paste blocks first, then sweep updates (physics/observers) at the
  # end. Recommended for redstone-heavy schematics.
  deferredPhysics: true
  # If true, paste observers and pistons LAST (see Litematica issue #538).
  observersLast: true
  # Run BlockState NBT through DataFixerUpper if MinecraftDataVersion mismatches.
  # If false, reject mismatched DataVersion files outright.
  runDataFixer: true
  # If runDataFixer is true, lowest DataVersion accepted (anything older is rejected).
  # 2586 = MC 1.16.5, 3953 = MC 1.21.x. Default = 2586.
  minDataVersion: 2586

schematic:
  # Schematics root directory (relative to plugin data folder).
  directory: schematics
  # Max file size accepted (bytes). Default 64 MiB.
  maxFileSizeBytes: 67108864

protocol:
  # Enable the Servux-compatible custom payload channel so vanilla Litematica
  # clients (with Servux disabled) can interact directly.
  enableServuxBridge: false
  # Channel name. Default matches sakura-ryoko/servux for client compatibility.
  channel: "servux:litematics"
  # Enable the Easy Place V3 server-side listener (PacketEvents-based).
  # When a Litematica client sends a ServerboundUseItemOnPacket with the
  # X-fractional protocol marker, the listener decodes it and overrides
  # the placed block's facing to match the schematic. No-op for vanilla
  # clients. Default off until smoke-tested against a real client.
  enableEasyPlace: false
  # Cap on the reassembled-size of a single Direct Paste upload via the
  # Servux outer-splitter. Default 128 MiB — raise if you expect schematics
  # whose NBT serialisation exceeds this; lower for hostile clients. NB:
  # Litematica's own client-side threshold for switching from inline
  # LitematicaPaste to the multi-frame sliceForServux is 64 MiB, so a 128
  # MiB cap covers the inline path comfortably with room for outliers.
  maxDirectPasteSize: 134217728

fawe:
  # Register a FAWE ClipboardFormat for .litematic when FAWE is detected.
  # Allows //schem load file.litematic in FAWE.
  registerClipboardFormat: true
