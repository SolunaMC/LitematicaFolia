name: ${name}
version: ${version}
main: fr.ekaii.litematica.LitematicaFolia
description: "${description}"
authors: ["exo"]
api-version: "${apiVersion}"
folia-supported: true
load: STARTUP
permissions:
  litematica.use:
    description: Base permission to use the plugin
    default: op
  litematica.paste:
    description: Paste a .litematic file into the world
    default: op
  litematica.save:
    description: Save a world region as .litematic
    default: op
  litematica.materials:
    description: Compute the materials list of a .litematic
    default: op
  litematica.admin:
    description: Bypass region checks (worldguard, plotsquared)
    default: op
  litematica.protocol.use:
    description: Talk to the Servux-compatible custom payload channels
    default: false
  litematica.protocol.paste:
    description: Stream a .litematic via the Servux paste protocol
    default: false
  litematica.protocol.easyplace:
    description: Use Easy Place V3 over the LitematicaFolia protocol channel
    default: false
  litematica.easyplace.use:
    description: Apply Easy Place V3 server-side overrides on placement
    default: op
